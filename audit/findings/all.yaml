  delta: "Na installatie bestaat een door elk uid-501-proces beschrijfbaar uitvoerbaar bestand op een vast pad (grant.sh) EN de app stuurt de gebruiker actief naar 'sudo <dat bestand>'. Nieuw t.o.v. de kale Mac: een achtergrondproces herschrijft grant.sh wachtwoordloos, en de escalatie naar WILLEKEURIGE root voltooit zodra de gebruiker — de instructie van de app volgend — het commando plakt en zijn wachtwoord typt in de veronderstelling dat hij alleen 'twee pmset-commando's' autoriseert. Bereikbaar door: elk-lokaal-proces (de herschrijving); de root-trigger vereist één menselijke plak-actie die de app zelf uitlokt."
  bereikbaar_door: "elk-lokaal-proces"
  risico: "midden"
  aanbeveling: "Draai de op-schijf-kopie nooit als root. Kies: (a) verwijder manualCommand + de README --remove-regel en verwijs uitsluitend naar de in-binary base64-route; of (b) laat ook de handmatige route de in-binary payload naar de root-shell pipen; of (c) installeer de kopie als root:wheel 0555 zodat uid 501 hem niet kan herschrijven. Corrigeer tegelijk de README-claim dat de leesbare kopie 'alleen niet meer als root uitgevoerd' wordt."

