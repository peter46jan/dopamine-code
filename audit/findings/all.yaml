  titel: "KETEN 2 — socket zet vlag + kill + schrijfbare bundel + codesign zonder -R + 30s-wachter = herlevende uid-501-malware met de app-identiteit, die daarna via de vertrouwde prompt root oogst"
  categorie: "keten"
