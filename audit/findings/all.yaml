  regel: "RestartGuard.swift:451 (codesign zonder -R); ControlServer.swift:164-221 (socket); RestartGuard.swift:341-501 (watchdogRound)"
  delta: "Losse schakels geven elk nul root-delta (elke automatische stap blijft uid 501; de gebruiker kon zelf al uid-501-code draaien). De SOM is erger: de app levert samen (1) een socket waarmee elk uid-501-proces de kernelvlag zet, (2) een schrijfbare app-binary op een vast pad, (3) een identiteitscontrole die alleen het zegel en niet de ondertekenaar toetst, en (4) een wachter die elke 30s herstart. Samen maken die van een eenmalige uid-501-trojan een ZELF-HERLEVENDE die een `kill -9` overleeft en de vertrouwde identiteit/prompts van Dopamine Code draagt. Nieuw t.o.v. de kale Mac: een automatisme dat elke 30s een schrijfbaar pad start zonder de ondertekenaar te controleren, plus een besturingskanaal om de herstart-voorwaarde zelf aan te zetten. Root komt nog steeds pas via de menselijke wachtwoordprompt (STAP 5), maar die confused-deputy-oogst wordt hierdoor persistent en betrouwbaar."
