  risico: "midden"
  aanbeveling: "Breek de keten op de goedkoopste plek: vervang RestartGuard.swift:451 door een `-R`-requirement op de eigen Team-ID (<team-id>), zodat de wachter alleen een door de eigen identiteit getekende bundel start — dat sluit STAP 1+3 af. Aanvullend: installeer de app-binary/bundel als root:wheel zodat uid 501 hem niet meer kan overschrijven; overweeg een plafond/rate-limit op de socket-herstart-uitlokking."

